name: Tests

on:
  push:
    branches: [main, prepare/arithmetic-source031]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          version: "0.30.1"
          tools: calcit,caps
          caps-version: "0.1.1"
      - name: Install dependencies
        run: |
          set -euo pipefail
          caps --ci --strict
          yarn install --immutable
          caps verify --toolchain
      - name: Prepare reviewed source transaction
        run: node prepare-source.mjs
      - name: Check snapshot and public contracts
        run: |
          set -euo pipefail
          test "$(calcit --version)" = "0.30.1"
          test ! -e compact.cirru
          test ! -e package.cirru
          calcit edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-blob.txt)"
          calcit --strict-types --warn-dyn-method --check-only --all-defs
          calcit fix --workflow strict --verify --format json | jq -e 'if .data.workflow.status? == "passed" and .diagnostics? == [] then true else ., false end'
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
      - name: Run native and JavaScript arithmetic
        run: yarn test
      - name: Preserve official source migration evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arithmetic-source-prepared
          path: |
            calcit.cirru
            acceptance
          retention-days: 3
