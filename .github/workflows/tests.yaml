name: Tests

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          version: "0.30.1"
          tools: calcit,caps
          caps-version: "0.1.1"
      - name: Install dependencies
        run: |
          set -euo pipefail
          caps --ci --strict
          yarn install --immutable
          caps verify --toolchain
      - name: Check snapshot and public contracts
        run: |
          set -euo pipefail
          test "$(calcit --version)" = "0.30.1"
          test ! -e compact.cirru
          test ! -e package.cirru
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit --strict-types --warn-dyn-method --check-only --all-defs
          calcit fix --workflow strict --verify
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
      - name: Run native and JavaScript arithmetic
        run: yarn test
